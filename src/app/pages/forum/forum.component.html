<div
  class="bg-gradient-to-b from-slate-800 via-slate-700 to-slate-900 text-white min-h-screen flex flex-col"
>
  <!-- Header -->
  <div class="flex justify-between items-center p-4 border-b border-gray-700">
    <h1 class="text-2xl font-bold">Company Forum</h1>
    <button class="px-4 py-2 bg-blue-600 rounded-md hover:bg-blue-700"
    (click)="showCreatePostModal()">New Post</button>
  </div>

  <!-- Main Content -->
  <div class="flex flex-grow">
    <!-- Posts Section -->
    <div class="flex-grow p-4">
      <!-- Filters -->
      <div class="flex justify-between items-center mb-4">
        <div class="flex gap-4">
          <button
            (click)="switchTab('All')"
            [class.text-blue-400]="activeTab === 'All'"
            [class.border-b-2]="activeTab === 'All'"
            [class.border-blue-400]="activeTab === 'All'"
            class="pb-1">
            All
          </button>
          <button
            (click)="switchTab('Unanswered')"
            [class.text-blue-400]="activeTab === 'Unanswered'"
            [class.border-b-2]="activeTab === 'Unanswered'"
            [class.border-blue-400]="activeTab === 'Unanswered'"
            class="pb-1">
            Unanswered
          </button>
        </div>
      </div>

      <!-- Posts -->
      <div *ngFor="let post of filteredPosts" class="bg-slate-700 p-4 rounded-md mb-4">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="text-lg font-semibold">{{ post.title }}</h3>
            <div class="text-sm text-gray-400 flex items-center gap-2">
              <span>{{ post.author }}</span>
              <span>{{ post.category }}</span>
              <span>{{ post.comments.length }} Comments</span>
            </div>
          </div>
          <span class="text-sm text-gray-400">{{ post.date }}</span>
        </div>
        <p class="mt-2 text-gray-300">{{ post.content }}</p>

        <!-- Actions -->
        <div class="flex justify-between items-center mt-4">
          <button
            (click)="toggleComments(post.id)"
            class="text-blue-400 hover:text-blue-500 flex items-center gap-1"
          >
            <mat-icon>comment</mat-icon> View Comments
          </button>
          <button
            (click)="showCommentInput(post.id)"
            class="text-green-400 hover:text-green-500 flex items-center gap-1"
          >
          Add Comment
          </button>
        </div>

        <!-- Comments Section -->
        <div *ngIf="post.showComments" class="mt-4">
          <div *ngFor="let comment of post.comments" class="bg-slate-600 p-3 rounded-md mb-2">
            <p>{{ comment.content }}</p>
            <span class="text-xs text-gray-400">{{ comment.date }}</span>
          </div>

          <!-- Add Comment -->
          <div class="flex gap-2 mt-2" *ngIf="activeInputPostId === post.id">
            <input
              [(ngModel)]="commentInputs[post.id]"
              placeholder="Write a comment..."
              class="flex-grow p-2 rounded-md bg-slate-500 text-white"
            />
            <button
              (click)="addComment(post.id)"
              class="px-4 py-2 bg-green-600 rounded-md hover:bg-green-700"
            >
              Add
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-create-post-modal
    *ngIf="isCreatePostModalVisible"
    [categories]="categoryNames"
    (postCreated)="handlePostCreated()"
    (closeModalEvent)="hideCreatePostModal()"
  ></app-create-post-modal>

</div>
